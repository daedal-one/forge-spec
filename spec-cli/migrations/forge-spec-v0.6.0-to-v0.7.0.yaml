from: forge-spec-v0.6.0
to: forge-spec-v0.7.0
summary: Adds explicit renderer-independent architectural subjects, intended scenario behavior and separate presentation views.
changes:
  - id: architecture-model
    kind: schema
    area: frontmatter
    description: Durable model facets declare addressable subjects, composition, directed interactions and about links; SCN flow declares participants and ordered interaction, parallel and alternative steps.
  - id: canonical-model-export
    kind: schema
    area: projection
    description: State and delta v5 expose architectural models, scenarios and views; inspect model exports a forge-spec-model/v1 revision envelope without executing repository code.
instructions:
  - id: preserve-prose
    actor: cli
    action: Advance the baseline without changing document bytes or inventing subjects and sequence order from prose.
    verification: Existing prose and authored intent digests remain unchanged.
  - id: author-explicit-behavior
    actor: agent
    action: Use model.replace and scenario.flow.replace typed mutations to declare architectural subjects and behavior where needed. Keep presentation in _views.toml and TASK outside durable graphs.
    verification: All endpoints resolve to subjects and step references preserve exact clauses.
validation:
  - command: spec lint
  - command: spec inspect model --json
