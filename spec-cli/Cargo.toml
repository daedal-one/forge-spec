[package]
name = "spec-cli"
version = "0.1.0"
edition = "2021"
description = "Specs format toolchain — validate, render, and query project specifications"

[[bin]]
name = "spec"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
toml = "0.8"
git2 = "0.19"
regex = "1"
petgraph = "0.7"
anyhow = "1"
thiserror = "2"
colored = "2"
walkdir = "2"
ratatui = "0.28"
crossterm = "0.28"
